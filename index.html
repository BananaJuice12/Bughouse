<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Bughouse Arena</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel2:#21262d;
  --border:#30363d;
  --text:#f0f6fc;
  --muted:#8b949e;
  --green:#238636;
  --blue:#1f6feb;
  --red:#da3633;
  --gold:#d29922;
  --light:#f0d9b5;
  --dark:#b58863;
}
body{
  margin:0;
  background:radial-gradient(circle at top,#182230 0,#0d1117 55%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{
  cursor:pointer;
  border:0;
  border-radius:8px;
  padding:10px 15px;
  color:white;
  background:var(--blue);
  font-weight:700;
}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{
  background:#0d1117;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px;
  outline:none;
}
input:focus,select:focus{border-color:var(--blue)}
.hidden{display:none!important}

header{
  padding:18px 25px;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,23,.9);
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(10px);
}
header h1{
  margin:0;
  font-size:24px;
}
header span{color:#58a6ff}

.screen{
  max-width:1500px;
  margin:auto;
  padding:25px;
}

.card{
  background:rgba(22,27,34,.95);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}

.home{
  max-width:600px;
  margin:80px auto;
  text-align:center;
}
.home h2{font-size:40px;margin:5px 0 10px}
.home p{color:var(--muted)}
.formrow{display:flex;gap:10px;margin:15px 0}
.formrow>*{flex:1}
.bigbtn{
  width:100%;
  font-size:18px;
  padding:14px;
  margin-top:8px;
}

#lobbyScreen{max-width:950px}
.lobby-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.room-link{
  display:flex;
  gap:8px;
}
.room-link input{flex:1}

.seats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.seat{
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:10px;
  padding:13px;
}
.seat .role{font-weight:800}
.seat .name{color:#58a6ff;margin-top:4px}
.seat.empty .name{color:var(--muted)}
.team1{border-left:4px solid #58a6ff}
.team2{border-left:4px solid #f85149}

#gameScreen{
  max-width:1500px;
}
.game-layout{
  display:grid;
  grid-template-columns:minmax(500px,1fr) 350px;
  gap:18px;
}
.boards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.board-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}
.board-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.board-title h3{margin:0}
.turn-dot{
  width:11px;height:11px;border-radius:50%;
  display:inline-block;margin-right:6px;
  background:#777;
}
.turn-dot.on{background:#3fb950;box-shadow:0 0 10px #3fb950}

.board{
  width:100%;
  max-width:580px;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-radius:5px;
  overflow:hidden;
  margin:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  user-select:none;
}
.square{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(27px,5vw,62px);
  line-height:1;
  cursor:pointer;
}
.square.light{background:var(--light)}
.square.dark{background:var(--dark)}
.square.selected{
  box-shadow:inset 0 0 0 5px rgba(255,215,0,.8);
}
.square.target::after{
  content:"";
  width:22%;
  height:22%;
  border-radius:50%;
  background:rgba(0,0,0,.25);
  position:absolute;
}
.square.capture::after{
  content:"";
  width:78%;
  height:78%;
  border-radius:50%;
  border:5px solid rgba(200,30,30,.55);
  position:absolute;
}
.piece{
  position:relative;
  z-index:2;
  font-family:"DejaVu Sans","Noto Sans Symbols 2",serif;
  text-shadow:0 2px 2px rgba(0,0,0,.3);
}
.whitepiece{color:#fff}
.blackpiece{color:#111}

.pocket{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 0;
  flex-wrap:wrap;
}
.pocket-piece{
  border:1px solid var(--border);
  background:#0d1117;
  border-radius:7px;
  min-width:38px;
  height:38px;
  padding:2px 5px;
  font-size:27px;
  cursor:pointer;
  position:relative;
}
.pocket-piece.selected{
  outline:3px solid #d29922;
}
.pocket-count{
  position:absolute;
  right:1px;
  bottom:0;
  background:#111;
  color:white;
  font-size:11px;
  border-radius:5px;
  padding:0 3px;
}

.clock{
  font-variant-numeric:tabular-nums;
  font-size:24px;
  font-weight:900;
  background:#090c10;
  padding:5px 10px;
  border-radius:7px;
}
.clock.low{color:#ff7b72}
.clock.active{box-shadow:0 0 0 2px #3fb950}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.side-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
}
.side-card h3{margin:0 0 10px}
.player-list{
  display:grid;
  gap:6px;
}
.player{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-radius:7px;
  background:#0d1117;
}
.chat{
  height:390px;
  display:flex;
  flex-direction:column;
}
.chat-messages{
  flex:1;
  overflow-y:auto;
  background:#0d1117;
  border-radius:8px;
  padding:8px;
}
.msg{
  margin-bottom:8px;
  word-wrap:break-word;
}
.msg b{color:#58a6ff}
.msg.system b{color:#d29922}
.chat-input{
  display:flex;
  gap:6px;
  margin-top:8px;
}
.chat-input input{flex:1}

.status{
  color:var(--muted);
  font-size:14px;
}
.success{color:#3fb950}
.error{color:#ff7b72}
.warning{color:#d29922}

.promo{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
}
.promo-box{
  background:var(--panel);
  border:1px solid var(--border);
  padding:25px;
  border-radius:15px;
  text-align:center;
}
.promo-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.promo-buttons button{
  font-size:28px;
  width:60px;
  height:60px;
}

.notice{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  background:#1c2128;
  border:1px solid var(--border);
}

@media(max-width:1000px){
  .game-layout{grid-template-columns:1fr}
  .boards{grid-template-columns:1fr}
}
@media(max-width:700px){
  .screen{padding:10px}
  .lobby-grid{grid-template-columns:1fr}
  .seats{grid-template-columns:1fr}
  .home{margin:35px auto}
  .home h2{font-size:32px}
}
</style>
</head>

<body>

<header>
  <h1>♟ <span>Bughouse Arena</span></h1>
</header>

<!-- HOME -->
<section id="homeScreen" class="screen">
  <div class="card home">
    <h2>Bughouse</h2>
    <p>Four players. Two boards. One chaotic battle.</p>

    <input id="username" maxlength="20" placeholder="Choose your username">

    <div class="formrow">
      <select id="timeControl">
        <option value="120">2 + 0</option>
        <option value="180">3 + 0</option>
        <option value="300">5 + 0</option>
      </select>
    </div>

    <button id="createBtn" class="bigbtn">Create Room</button>

    <div id="joinNotice" class="notice hidden">
      You have been invited to a room.
    </div>

    <button id="joinBtn" class="bigbtn hidden">Join Room</button>

    <p id="connectionStatus" class="status"></p>
  </div>
</section>

<!-- LOBBY -->
<section id="lobbyScreen" class="screen hidden">
  <div class="card">
    <h2>Room Lobby</h2>

    <div class="notice">
      <b>Share this link with your 3 friends:</b>
      <div class="room-link">
        <input id="shareLink" readonly>
        <button id="copyLink">Copy</button>
      </div>
    </div>

    <div class="lobby-grid">

      <div>
        <h3>Players</h3>
        <div id="seats" class="seats"></div>
      </div>

      <div>
        <h3>Host controls</h3>

        <div class="formrow">
          <label>
            Time:
            <select id="lobbyTime">
              <option value="120">2 + 0</option>
              <option value="180">3 + 0</option>
              <option value="300">5 + 0</option>
            </select>
          </label>
        </div>

        <div id="teamControls"></div>

        <button id="startBtn" class="bigbtn" disabled>
          Start Match
        </button>

        <p id="lobbyStatus" class="status"></p>
      </div>

    </div>
  </div>
</section>

<!-- GAME -->
<section id="gameScreen" class="screen hidden">
  <div class="game-layout">

    <div class="boards">

      <!-- BOARD 1 -->
      <div class="board-card">
        <div class="board-title">
          <h3>Board 1</h3>
          <span id="clock1label"></span>
        </div>

        <div id="pocket1top" class="pocket"></div>
        <div id="board1" class="board"></div>
        <div id="pocket1bottom" class="pocket"></div>
      </div>

      <!-- BOARD 2 -->
      <div class="board-card">
        <div class="board-title">
          <h3>Board 2</h3>
          <span id="clock2label"></span>
        </div>

        <div id="pocket2top" class="pocket"></div>
        <div id="board2" class="board"></div>
        <div id="pocket2bottom" class="pocket"></div>
      </div>

    </div>

    <aside class="sidebar">

      <div class="side-card">
        <h3>Players</h3>
        <div id="gamePlayers" class="player-list"></div>
      </div>

      <div class="side-card chat">
        <h3>Chat</h3>
        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">
          <input id="chatInput" maxlength="250" placeholder="Type a message...">
          <button id="sendChat">Send</button>
        </div>
      </div>

      <div class="side-card">
        <div id="gameStatus" class="status">Waiting...</div>
      </div>

    </aside>

  </div>
</section>

<!-- PROMOTION -->
<div id="promotion" class="promo hidden">
  <div class="promo-box">
    <h2>Promote pawn</h2>
    <div class="promo-buttons">
      <button data-promo="q">♛</button>
      <button data-promo="r">♜</button>
      <button data-promo="b">♝</button>
      <button data-promo="n">♞</button>
    </div>
  </div>
</div>

<script type="module">

import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js";

/* =========================================================
   BUGHOUSE ARENA
   Single-file GitHub Pages version
   ========================================================= */

const PIECES = {
  p:"♟",
  n:"♞",
  b:"♝",
  r:"♜",
  q:"♛",
  k:"♚"
};

const FILES = ["a","b","c","d","e","f","g","h"];
const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

let peer = null;
let hostId = null;
let isHost = false;
let mySeat = null;
let myName = "";
let hostConnection = null;

let connections = {};
let nextConnectionSeat = 0;

let state = null;
let localGames = [null,null];

let selectedSquare = null;
let selectedPocket = null;
let promotionMove = null;

let clockTimer = null;
let lastRender = 0;

const $ = id => document.getElementById(id);

const urlParams = new URLSearchParams(location.search);
const invitedRoom = urlParams.get("room");

if(invitedRoom){
  $("joinNotice").classList.remove("hidden");
  $("joinBtn").classList.remove("hidden");
  $("createBtn").classList.add("hidden");
}

/* =========================================================
   INITIAL STATE
   ========================================================= */

function emptyState(timeSeconds){
  return {
    version:1,
    started:false,
    ended:false,
    timeSeconds,
    players:[
      null,null,null,null
    ],
    teams:[1,2,1,2],
    games:[
      {
        fen:START_FEN,
        pockets:{p:0,n:0,b:0,r:0,q:0}
      },
      {
        fen:START_FEN,
        pockets:{p:0,n:0,b:0,r:0,q:0}
      }
    ],
    clocks:[
      [timeSeconds*1000,timeSeconds*1000],
      [timeSeconds*1000,timeSeconds*1000]
    ],
    lastClockUpdate:Date.now(),
    chat:[]
  };
}

/* =========================================================
   CONNECTION
   ========================================================= */

function setStatus(text, cls=""){
  const el=$("connectionStatus");
  el.textContent=text;
  el.className="status "+cls;
}

function createPeer(){
  return new Promise((resolve,reject)=>{
    try{
      peer=new Peer();

      peer.on("open",id=>{
        resolve(id);
      });

      peer.on("error",err=>{
        console.error(err);

        if(isHost){
          setStatus("Connection error: "+(err.type||err.message),"error");
        }else{
          setStatus("Could not connect: "+(err.type||err.message),"error");
        }

        reject(err);
      });

      peer.on("disconnected",()=>{
        setStatus("Network connection interrupted.","warning");
      });

      peer.on("close",()=>{
        setStatus("Connection closed.","error");
      });

    }catch(e){
      reject(e);
    }
  });
}

/* =========================================================
   HOST
   ========================================================= */

$("createBtn").onclick=async()=>{
  myName=$("username").value.trim();

  if(!myName){
    setStatus("Enter a username first.","error");
    return;
  }

  const time=Number($("timeControl").value);

  $("createBtn").disabled=true;
  setStatus("Creating room...");

  try{
    isHost=true;
    state=emptyState(time);

    const id=await createPeer();
    hostId=id;
    mySeat=0;

    state.players[0]={
      name:myName,
      seat:0,
      connected:true
    };

    const link=location.origin+
      location.pathname+
      "?room="+encodeURIComponent(hostId);

    history.replaceState({}, "", "?room="+encodeURIComponent(hostId));

    $("shareLink").value=link;

    showLobby();
    renderLobby();

    peer.on("connection",incomingConnection);

    addSystemMessage("Room created. Invite three friends.");

  }catch(e){
    $("createBtn").disabled=false;
    setStatus("Could not create room.","error");
  }
};

function incomingConnection(conn){

  if(!isHost)return;

  conn.on("open",()=>{
    const freeSeat=findFreeSeat();

    if(freeSeat===-1){
      conn.send({
        type:"error",
        message:"Room is full."
      });
      conn.close();
      return;
    }

    connections[freeSeat]=conn;

    conn.seat=freeSeat;

    conn.on("data",data=>{
      hostReceive(conn,data);
    });

    conn.on("close",()=>{
      if(state && state.players[freeSeat]){
        state.players[freeSeat].connected=false;
        broadcastState();
        renderLobby();
      }
    });

    conn.send({
      type:"welcome",
      seat:freeSeat,
      state
    });

    state.players[freeSeat]={
      name:"Joining...",
      seat:freeSeat,
      connected:true
    };

    broadcastState();
    renderLobby();
  });
}

function findFreeSeat(){
  for(let i=1;i<4;i++){
    if(!state.players[i])return i;
  }
  return -1;
}

function hostReceive(conn,data){

  if(!data || typeof data!=="object")return;

  if(data.type==="hello"){

    const seat=conn.seat;

    if(!state.players[seat])return;

    let name=String(data.name||"Player")
      .trim()
      .slice(0,20);

    if(!name)name="Player";

    state.players[seat].name=name;

    broadcastState();
    renderLobby();
    return;
  }

  if(data.type==="action"){
    handleAction(data.action,conn.seat);
    return;
  }

  if(data.type==="chat"){
    addChat(data.name,data.message);
    return;
  }

  if(data.type==="team"){
    if(conn.seat===0)return;
    return;
  }
}

/* =========================================================
   JOIN
   ========================================================= */

$("joinBtn").onclick=async()=>{
  myName=$("username").value.trim();

  if(!myName){
    setStatus("Enter a username first.","error");
    return;
  }

  if(!invitedRoom){
    setStatus("No room link found.","error");
    return;
  }

  $("joinBtn").disabled=true;
  setStatus("Connecting to room...");

  try{
    isHost=false;

    await createPeer();

    hostId=invitedRoom;

    hostConnection=peer.connect(hostId,{
      reliable:true
    });

    hostConnection.on("open",()=>{
      hostConnection.send({
        type:"hello",
        name:myName
      });

      setStatus("Connected.","success");
    });

    hostConnection.on("data",data=>{
      clientReceive(data);
    });

    hostConnection.on("close",()=>{
      setStatus("Host disconnected. The room has ended.","error");
    });

    hostConnection.on("error",e=>{
      setStatus("Connection error.","error");
      console.error(e);
    });

  }catch(e){
    $("joinBtn").disabled=false;
    setStatus("Could not connect to room.","error");
  }
};

function clientReceive(data){

  if(data.type==="welcome"){
    mySeat=data.seat;
    state=data.state;

    showLobby();
    renderLobby();

    return;
  }

  if(data.type==="state"){
    state=data.state;

    if(state.started){
      showGame();
    }else{
      showLobby();
    }

    renderAll();
    return;
  }

  if(data.type==="chat"){
    addChatLocal(data.name,data.message);
    return;
  }

  if(data.type==="error"){
    alert(data.message||"Server error");
  }
}

/* =========================================================
   NETWORK STATE
   ========================================================= */

function sendToHost(message){
  if(hostConnection && hostConnection.open){
    hostConnection.send(message);
  }
}

function broadcast(message){
  for(const seat in connections){
    const c=connections[seat];

    if(c && c.open){
      try{c.send(message)}catch(e){}
    }
  }
}

function broadcastState(){
  if(!isHost)return;

  broadcast({
    type:"state",
    state
  });
}

function syncState(){
  if(isHost){
    broadcastState();
  }else{
    sendToHost({
      type:"requestState"
    });
  }
}

/* =========================================================
   LOBBY
   ========================================================= */

function showLobby(){
  $("homeScreen").classList.add("hidden");
  $("gameScreen").classList.add("hidden");
  $("lobbyScreen").classList.remove("hidden");
}

function renderLobby(){

  if(!state)return;

  $("lobbyTime").value=String(state.timeSeconds);

  const seats=$("seats");
  seats.innerHTML="";

  const roles=[
    "Board 1 — White",
    "Board 1 — Black",
    "Board 2 — White",
    "Board 2 — Black"
  ];

  for(let i=0;i<4;i++){

    const p=state.players[i];

    const div=document.createElement("div");

    div.className=
      "seat "+
      (state.teams[i]===1?"team1":"team2")+
      (!p?" empty":"");

    div.innerHTML=`
      <div class="role">${roles[i]}</div>
      <div class="name">
        ${p ? escapeHtml(p.name) : "Waiting for player..."}
      </div>
      <div class="status">
        Team ${state.teams[i]}
      </div>
    `;

    seats.appendChild(div);
  }

  renderTeamControls();

  const full=state.players.every(Boolean);

  const teamsOK=
    state.players.filter((_,i)=>state.teams[i]===1).length===2 &&
    state.players.filter((_,i)=>state.teams[i]===2).length===2;

  $("startBtn").disabled=!(
    isHost &&
    full &&
    teamsOK &&
    !state.started
  );

  if(!full){
    $("lobbyStatus").textContent=
      "Waiting for "+state.players.filter(x=>!x).length+" more player(s).";
  }else if(!teamsOK){
    $("lobbyStatus").textContent=
      "Each team must have exactly two players.";
  }else{
    $("lobbyStatus").textContent=
      isHost
      ?"All players ready. Start when everyone is ready."
      :"Waiting for the host to start.";
  }
}

function renderTeamControls(){

  const box=$("teamControls");
  box.innerHTML="";

  if(!isHost){
    box.innerHTML=
      `<p class="status">The host chooses the teams.</p>`;
    return;
  }

  for(let i=0;i<4;i++){

    const p=state.players[i];

    if(!p)continue;

    const row=document.createElement("div");
    row.style.marginBottom="8px";

    const select=document.createElement("select");

    select.innerHTML=`
      <option value="1">Team 1</option>
      <option value="2">Team 2</option>
    `;

    select.value=state.teams[i];

    select.onchange=()=>{
      state.teams[i]=Number(select.value);
      broadcastState();
      renderLobby();
    };

    row.innerHTML=
      `<span>${escapeHtml(p.name)} — </span>`;

    row.appendChild(select);
    box.appendChild(row);
  }
}

$("lobbyTime").onchange=()=>{
  if(!isHost || state.started)return;

  state.timeSeconds=Number($("lobbyTime").value);

  state.clocks=[
    [state.timeSeconds*1000,state.timeSeconds*1000],
    [state.timeSeconds*1000,state.timeSeconds*1000]
  ];

  broadcastState();
  renderLobby();
};

$("startBtn").onclick=()=>{
  if(!isHost)return;

  if(state.players.some(p=>!p)){
    alert("Four players are required.");
    return;
  }

  const t1=state.players
    .filter((_,i)=>state.teams[i]===1).length;

  if(t1!==2){
    alert("Each team needs two players.");
    return;
  }

  state.started=true;
  state.ended=false;
  state.lastClockUpdate=Date.now();

  state.games=[
    {
      fen:START_FEN,
      pockets:{p:0,n:0,b:0,r:0,q:0}
    },
    {
      fen:START_FEN,
      pockets:{p:0,n:0,b:0,r:0,q:0}
    }
  ];

  state.clocks=[
    [state.timeSeconds*1000,state.timeSeconds*1000],
    [state.timeSeconds*1000,state.timeSeconds*1000]
  ];

  broadcastState();
  showGame();
  renderAll();
  addSystemMessage("Match started!");
};

/* =========================================================
   GAME
   ========================================================= */

function showGame(){
  $("homeScreen").classList.add("hidden");
  $("lobbyScreen").classList.add("hidden");
  $("gameScreen").classList.remove("hidden");

  if(!clockTimer){
    clockTimer=setInterval(()=>{
      renderClocks();
    },100);
  }
}

function initLocalGames(){

  if(!state)return;

  localGames=[
    new Chess(state.games[0].fen),
    new Chess(state.games[1].fen)
  ];
}

function renderAll(){
  if(!state)return;

  if(state.started){
    showGame();
    initLocalGames();
    renderBoards();
    renderPlayers();
    renderClocks();
    renderStatus();
  }else{
    renderLobby();
  }
}

/* =========================================================
   BOARD RENDERING
   ========================================================= */

function renderBoards(){

  if(!localGames[0]||!localGames[1])return;

  renderBoard(0);
  renderBoard(1);

  renderPocket(0);
  renderPocket(1);
}

function renderBoard(boardIndex){

  const boardEl=$("board"+(boardIndex+1));
  boardEl.innerHTML="";

  const seatWhite=boardIndex===0?0:2;
  const seatBlack=boardIndex===0?1:3;

  const myColor =
    mySeat===seatWhite ? "w" :
    mySeat===seatBlack ? "b" :
    null;

  const orientation =
    myColor==="b" ? "b" : "w";

  const game=localGames[boardIndex];

  const ranks=
    orientation==="w"
    ? [8,7,6,5,4,3,2,1]
    : [1,2,3,4,5,6,7,8];

  const files=
    orientation==="w"
    ? FILES
    : [...FILES].reverse();

  let legalTargets=[];

  if(selectedSquare && selectedSquare.board===boardIndex){

    try{
      legalTargets=game.moves({
        square:selectedSquare.square,
        verbose:true
      });
    }catch(e){
      legalTargets=[];
    }
  }

  for(const rank of ranks){
    for(const file of files){

      const square=file+rank;
      const piece=game.get(square);

      const div=document.createElement("div");

      const isLight=
        (FILES.indexOf(file)+rank)%2===1;

      div.className=
        "square "+
        (isLight?"light":"dark");

      if(
        selectedSquare &&
        selectedSquare.board===boardIndex &&
        selectedSquare.square===square
      ){
        div.classList.add("selected");
      }

      const target=legalTargets.find(m=>m.to===square);

      if(target){
        if(piece)div.classList.add("capture");
        else div.classList.add("target");
      }

      if(selectedPocket &&
        selectedPocket.board===boardIndex){
        if(!piece){
          div.classList.add("target");
        }
      }

      if(piece){

        const span=document.createElement("span");

        span.className=
          "piece "+
          (piece.color==="w"?"whitepiece":"blackpiece");

        span.textContent=PIECES[piece.type];

        div.appendChild(span);
      }

      div.onclick=()=>squareClicked(
        boardIndex,
        square,
        piece
      );

      boardEl.appendChild(div);
    }
  }

  const turn=game.turn();

  const canPlay=
    !state.ended &&
    state.started &&
    (
      (boardIndex===0 && (mySeat===0||mySeat===1)) ||
      (boardIndex===1 && (mySeat===2||mySeat===3))
    );

  const active =
    canPlay &&
    (
      (turn==="w" && (mySeat===(boardIndex===0?0:2))) ||
      (turn==="b" && (mySeat===(boardIndex===0?1:3)))
    );

  const label=$("clock"+(boardIndex+1)+"label");

  if(label){
    label.innerHTML=
      `<span class="turn-dot ${active?"on":""}"></span>`+
      `${turn==="w"?"White":"Black"} to move`;
  }
}

/* =========================================================
   BOARD INPUT
   ========================================================= */

function squareClicked(board,square,piece){

  if(!state || state.ended)return;

  const seatWhite=board===0?0:2;
  const seatBlack=board===0?1:3;

  const myColor =
    mySeat===seatWhite?"w":
    mySeat===seatBlack?"b":null;

  if(!myColor)return;

  const game=localGames[board];

  if(selectedPocket &&
     selectedPocket.board===board){

    sendAction({
      type:"drop",
      board,
      square,
      piece:selectedPocket.type
    });

    selectedPocket=null;
    renderBoards();
    return;
  }

  if(selectedSquare){

    if(
      selectedSquare.board===board &&
      selectedSquare.square===square
    ){
      selectedSquare=null;
      renderBoards();
      return;
    }

    if(selectedSquare.board===board){

      const moves=game.moves({
        square:selectedSquare.square,
        verbose:true
      });

      const move=moves.find(m=>m.to===square);

      if(move){

        if(move.promotion){

          promotionMove={
            board,
            from:selectedSquare.square,
            to:square
          };

          $("promotion").classList.remove("hidden");
          return;
        }

        sendAction({
          type:"move",
          board,
          from:selectedSquare.square,
          to:square
        });

        selectedSquare=null;
        return;
      }
    }
  }

  if(piece && piece.color===myColor){

    const turn=game.turn();

    if(turn!==myColor)return;

    selectedSquare={
      board,
      square
    };

    selectedPocket=null;

    renderBoards();
  }
}

/* =========================================================
   POCKETS
   ========================================================= */

function renderPocket(board){

  const whiteSeat=board===0?0:2;
  const blackSeat=board===0?1:3;

  const mySeatOnBoard=
    mySeat===whiteSeat||mySeat===blackSeat;

  const team=mySeatOnBoard
    ?state.teams[mySeat]
    :null;

  const partnerSeat=
    mySeatOnBoard
    ?findPartner(mySeat)
    :null;

  const pocket=
    mySeatOnBoard
    ?state.games[board].pockets
    :null;

  const top=$("pocket"+(board+1)+"top");
  const bottom=$("pocket"+(board+1)+"bottom");

  top.innerHTML="";
  bottom.innerHTML="";

  const types=["q","r","b","n","p"];

  for(const type of types){

    const count=pocket?Number(pocket[type]||0):0;

    if(!count)continue;

    const button=document.createElement("button");

    button.className="pocket-piece";

    if(
      selectedPocket &&
      selectedPocket.board===board &&
      selectedPocket.type===type
    ){
      button.classList.add("selected");
    }

    button.innerHTML=
      `<span class="whitepiece">${PIECES[type]}</span>`+
      `<span class="pocket-count">${count}</span>`;

    button.onclick=()=>{
      if(!mySeatOnBoard)return;

      selectedSquare=null;

      if(
        selectedPocket &&
        selectedPocket.board===board &&
        selectedPocket.type===type
      ){
        selectedPocket=null;
      }else{
        selectedPocket={
          board,
          type
        };
      }

      renderBoards();
    };

    if(
      mySeatOnBoard &&
      (
        (mySeat===whiteSeat && state.games[board].fen.split(" ")[1]==="w") ||
        (mySeat===blackSeat && state.games[board].fen.split(" ")[1]==="b")
      )
    ){
      bottom.appendChild(button);
    }else if(mySeatOnBoard){
      top.appendChild(button);
    }
  }

  if(mySeatOnBoard){
    const who=state.players[partnerSeat];
    const label=document.createElement("span");
    label.className="status";
    label.textContent=
      "Drops received from "+(who?who.name:"teammate");
    top.prepend(label);
  }
}

function findPartner(seat){

  const team=state.teams[seat];

  for(let i=0;i<4;i++){
    if(i!==seat &&
       state.players[i] &&
       state.teams[i]===team){
      return i;
    }
  }

  return null;
}

/* =========================================================
   HOST GAME AUTHORITY
   ========================================================= */

function handleAction(action,seat){

  if(!isHost || !state || !state.started || state.ended)return;

  if(!action || typeof action!=="object")return;

  updateClocks();

  if(action.type==="move"){
    hostMove(action,seat);
  }

  if(action.type==="drop"){
    hostDrop(action,seat);
  }

  broadcastState();
  renderAll();
}

function hostMove(action,seat){

  const board=Number(action.board);

  if(board!==0 && board!==1)return;

  const whiteSeat=board===0?0:2;
  const blackSeat=board===0?1:3;

  const color=
    seat===whiteSeat?"w":
    seat===blackSeat?"b":
    null;

  if(!color)return;

  const game=new Chess(state.games[board].fen);

  if(game.turn()!==color)return;

  const from=String(action.from||"");
  const to=String(action.to||"");

  if(!/^[a-h][1-8]$/.test(from))return;
  if(!/^[a-h][1-8]$/.test(to))return;

  const moving=game.get(from);

  if(!moving || moving.color!==color)return;

  let move;

  try{

    const legal=game.moves({
      square:from,
      verbose:true
    });

    const candidate=legal.find(m=>m.to===to);

    if(!candidate)return;

    if(candidate.promotion){

      const promotion=
        ["q","r","b","n"].includes(action.promotion)
        ?action.promotion
        :"q";

      move=game.move({
        from,
        to,
        promotion
      });

    }else{

      move=game.move({
        from,
        to
      });

    }

  }catch(e){
    return;
  }

  if(!move)return;

  if(move.captured){

    const recipient=findPartner(seat);

    if(recipient!==null){

      const pocketBoard=
        recipient===0||recipient===1?0:1;

      // The teammate receives the captured piece on THEIR board.
      state.games[pocketBoard].pockets[move.captured]++;
    }
  }

  state.games[board].fen=game.fen();

  if(game.isGameOver()){
    state.ended=true;
  }

  state.lastClockUpdate=Date.now();
}

function hostDrop(action,seat){

  const board=Number(action.board);

  if(board!==0 && board!==1)return;

  const whiteSeat=board===0?0:2;
  const blackSeat=board===0?1:3;

  const color=
    seat===whiteSeat?"w":
    seat===blackSeat?"b":
    null;

  if(!color)return;

  const type=String(action.piece||"");

  if(!["p","n","b","r","q"].includes(type))return;

  const pocketBoard=
    seat===0||seat===1?0:1;

  const pocket=state.games[pocketBoard].pockets;

  if((pocket[type]||0)<=0)return;

  const square=String(action.square||"");

  if(!/^[a-h][1-8]$/.test(square))return;

  const rank=Number(square[1]);

  // Pawns may not be dropped on first or last rank.
  if(type==="p" && (rank===1||rank===8))return;

  const game=new Chess(state.games[board].fen);

  if(game.get(square))return;

  /*
     Put the dropped piece on the board temporarily.
     This lets chess.js check king safety.
  */
  try{

    const ok=game.put({
      type,
      color
    },square);

    if(!ok)return;

    /*
      A drop may not leave the dropping side's king in check.
      We deliberately allow normal bughouse sacrifices.
      "In capture" therefore means an illegal occupied/capture
      square is never used for a drop.
    */
    const kingSquare=game.findPiece({
      type:"k",
      color
    })[0];

    if(!kingSquare)return;

    if(game.isAttacked(
      kingSquare,
      color==="w"?"b":"w"
    )){
      return;
    }

    /*
      Also prevent dropping a piece directly on an enemy-attacked
      square. This implements the stricter "don't put a piece in
      capture" rule requested.
    */
    if(game.isAttacked(
      square,
      color==="w"?"b":"w"
    )){
      return;
    }

    // A drop does not consume a chess turn unless it is that side's turn.
    if(game.turn()!==color)return;

    /*
      chess.js does not have bughouse drops, so we now construct
      the resulting FEN and advance the turn.
    */
    game.setTurn(color==="w"?"b":"w");

    state.games[board].fen=game.fen();

    pocket[type]--;

  }catch(e){
    console.error(e);
    return;
  }

  state.lastClockUpdate=Date.now();
}

/* =========================================================
   CLOCK
   ========================================================= */

function updateClocks(){

  if(!isHost || !state || !state.started || state.ended)return;

  const now=Date.now();
  const elapsed=now-state.lastClockUpdate;

  if(elapsed<=0)return;

  for(let b=0;b<2;b++){

    const game=new Chess(state.games[b].fen);
    const color=game.turn()==="w"?0:1;

    state.clocks[b][color]-=elapsed;

    if(state.clocks[b][color]<=0){

      state.clocks[b][color]=0;
      state.ended=true;

      state.lastClockUpdate=now;
      return;
    }
  }

  state.lastClockUpdate=now;
}

function renderClocks(){

  if(!state || !state.started)return;

  if(isHost && !state.ended){
    updateClocks();
  }

  for(let b=0;b<2;b++){

    const game=new Chess(state.games[b].fen);

    const w=state.clocks[b][0];
    const bl=state.clocks[b][1];

    const whiteSeat=b===0?0:2;
    const blackSeat=b===0?1:3;

    // Display both clocks using board title.
    const title=document.querySelector(
      `#board${b+1}`
    )?.parentElement;

    if(!title)continue;

    let old=title.querySelector(".dual-clock");

    if(!old){
      old=document.createElement("div");
      old.className="dual-clock";
      old.style.display="flex";
      old.style.justifyContent="space-between";
      old.style.marginTop="8px";
      title.appendChild(old);
    }

    old.innerHTML=`
      <span class="clock ${game.turn()==="w"?"active":""} ${w<10000?"low":""}">
        ${formatTime(w)} ${escapeHtml(state.players[whiteSeat]?.name||"")}
      </span>
      <span class="clock ${game.turn()==="b"?"active":""} ${bl<10000?"low":""}">
        ${formatTime(bl)} ${escapeHtml(state.players[blackSeat]?.name||"")}
      </span>
    `;
  }

  if(isHost){
    broadcastState();
  }
}

function formatTime(ms){

  ms=Math.max(0,ms);

  const total=Math.ceil(ms/1000);

  const min=Math.floor(total/60);
  const sec=total%60;

  return `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* =========================================================
   PLAYERS / STATUS
   ========================================================= */

function renderPlayers(){

  const el=$("gamePlayers");
  el.innerHTML="";

  const roles=[
    "B1 White",
    "B1 Black",
    "B2 White",
    "B2 Black"
  ];

  for(let i=0;i<4;i++){

    const p=state.players[i];

    if(!p)continue;

    const div=document.createElement("div");

    div.className="player";

    div.innerHTML=`
      <span>
        ${escapeHtml(p.name)}
        ${i===mySeat?" <b>(you)</b>":""}
      </span>
      <span>Team ${state.teams[i]}</span>
    `;

    el.appendChild(div);
  }
}

function renderStatus(){

  let text="Match in progress.";

  if(state.ended){
    text="Game over.";
  }else{

    const game0=new Chess(state.games[0].fen);
    const game1=new Chess(state.games[1].fen);

    if(game0.isCheckmate()){
      text="Board 1 checkmate.";
    }else if(game1.isCheckmate()){
      text="Board 2 checkmate.";
    }else if(game0.isCheck()){
      text="Board 1 is in check.";
    }else if(game1.isCheck()){
      text="Board 2 is in check.";
    }
  }

  $("gameStatus").textContent=text;
}

/* =========================================================
   CHAT
   ========================================================= */

function addChat(name,message){

  if(!message)return;

  message=String(message)
    .trim()
    .slice(0,250);

  if(!message)return;

  state.chat.push({
    name:String(name||"Player").slice(0,20),
    message
  });

  if(state.chat.length>100){
    state.chat.shift();
  }

  broadcast({
    type:"chat",
    name,
    message
  });

  // Host also renders locally.
  addChatLocal(name,message);
}

function addChatLocal(name,message){

  const box=$("chatMessages");

  const div=document.createElement("div");

  div.className="msg";

  div.innerHTML=
    `<b>${escapeHtml(name)}</b>: `+
    `${escapeHtml(message)}`;

  box.appendChild(div);

  while(box.children.length>100){
    box.removeChild(box.firstChild);
  }

  box.scrollTop=box.scrollHeight;
}

function addSystemMessage(message){

  const box=$("chatMessages");

  const div=document.createElement("div");

  div.className="msg system";

  div.innerHTML=
    `<b>System:</b> ${escapeHtml(message)}`;

  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

$("sendChat").onclick=sendChat;

$("chatInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")sendChat();
});

function sendChat(){

  const input=$("chatInput");
  const message=input.value.trim();

  if(!message)return;

  input.value="";

  if(isHost){
    addChat(myName,message);
  }else{
    sendToHost({
      type:"chat",
      name:myName,
      message
    });

    addChatLocal(myName,message);
  }
}

/* =========================================================
   PROMOTION
   ========================================================= */

document.querySelectorAll("[data-promo]").forEach(button=>{

  button.onclick=()=>{

    if(!promotionMove)return;

    const promotion=button.dataset.promo;

    sendAction({
      type:"move",
      board:promotionMove.board,
      from:promotionMove.from,
      to:promotionMove.to,
      promotion
    });

    promotionMove=null;

    $("promotion").classList.add("hidden");
    selectedSquare=null;
  };

});

/* =========================================================
   SEND ACTION
   ========================================================= */

function sendAction(action){

  if(isHost){

    handleAction(action,mySeat);

  }else{

    sendToHost({
      type:"action",
      action
    });

  }
}

/* =========================================================
   COPY ROOM
   ========================================================= */

$("copyLink").onclick=async()=>{

  const input=$("shareLink");

  try{
    await navigator.clipboard.writeText(input.value);

    $("copyLink").textContent="Copied!";

    setTimeout(()=>{
      $("copyLink").textContent="Copy";
    },1500);

  }catch(e){

    input.select();
    document.execCommand("copy");

  }
};

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHtml(str){

  return String(str??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   STARTUP
   ========================================================= */

renderLobby();

if(invitedRoom){
  setStatus("Enter your username, then click Join Room.");
}else{
  setStatus("Choose a username and create a room.");
}

/*
   When the host changes state, redraw everything.
*/
setInterval(()=>{
  if(state && state.started){
    initLocalGames();
    renderBoards();
    renderPlayers();
    renderStatus();
  }
},500);
